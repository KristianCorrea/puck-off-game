<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#050b12" />
    <title>Puck Off</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Teko:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: radial-gradient(ellipse at top, #10243a 0%, #050b12 55%);
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        touch-action: none;
      }

      #game canvas {
        image-rendering: auto;
        touch-action: none;
      }

      .shell-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1.5rem;
        padding-top: max(1.5rem, env(safe-area-inset-top));
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        text-align: center;
        font-family: "Nunito", system-ui, sans-serif;
        color: #e2e8f0;
        background: rgba(5, 11, 18, 0.92);
        touch-action: none;
      }

      .shell-overlay.is-visible {
        display: flex;
      }

      .shell-overlay h1 {
        margin: 0;
        font-family: "Teko", "Arial Narrow", Impact, sans-serif;
        font-size: clamp(2.5rem, 12vw, 4rem);
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #f8fafc;
      }

      .shell-overlay p {
        margin: 0;
        max-width: 18rem;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.4;
        color: #94a3b8;
      }

      .shell-overlay .shell-cta {
        margin-top: 0.5rem;
        border: 0;
        border-radius: 0.35rem;
        padding: 0.85rem 1.6rem;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: #0f172a;
        background: #fbbf24;
        cursor: pointer;
      }

      .shell-overlay .shell-cta:active {
        background: #fde68a;
      }

      #rotate-overlay .shell-icon {
        font-size: 3rem;
        line-height: 1;
        transform: rotate(90deg);
      }

      .shell-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        justify-content: center;
        margin-top: 0.5rem;
      }

      .shell-cta.secondary {
        background: #334155;
        color: #e2e8f0;
      }

      .shell-cta.secondary:active {
        background: #475569;
      }

      .shell-cta:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .lobby-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
        align-items: center;
        width: min(100%, 22rem);
      }

      .lobby-row input {
        flex: 1 1 8rem;
        min-width: 0;
        border: 1px solid #334155;
        border-radius: 0.35rem;
        padding: 0.7rem 0.85rem;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #f8fafc;
        background: #0f172a;
      }

      .lobby-code {
        margin: 0.25rem 0 0;
        font-family: "Teko", "Arial Narrow", Impact, sans-serif;
        font-size: clamp(2rem, 10vw, 3rem);
        letter-spacing: 0.14em;
        color: #fbbf24;
      }

      .lobby-server {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 600;
        color: #64748b;
        word-break: break-all;
      }

      #lobby-countdown {
        display: none;
        margin: 0.25rem 0 0;
        font-family: "Teko", "Arial Narrow", Impact, sans-serif;
        font-size: clamp(3.5rem, 18vw, 6rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1;
        color: #fbbf24;
      }

      #lobby-countdown.is-visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <div id="tap-to-play" class="shell-overlay" role="dialog" aria-modal="true">
      <h1>PUCK OFF</h1>
      <p>Landscape play · flick pucks · first to 3</p>
      <div class="shell-actions">
        <button type="button" class="shell-cta" id="play-local-btn" data-mode="local">
          LOCAL
        </button>
        <button
          type="button"
          class="shell-cta secondary"
          id="play-online-btn"
          data-mode="online"
        >
          ONLINE
        </button>
      </div>
    </div>

    <div
      id="online-lobby"
      class="shell-overlay"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
    >
      <h1>ONLINE</h1>
      <p id="lobby-status">Connecting…</p>
      <p class="lobby-code" id="lobby-code">————</p>
      <p id="lobby-countdown" aria-live="polite"></p>
      <p class="lobby-server" id="lobby-server"></p>
      <div class="shell-actions">
        <button type="button" class="shell-cta" id="lobby-create-btn">
          CREATE ROOM
        </button>
      </div>
      <div class="lobby-row">
        <input
          id="lobby-join-input"
          type="text"
          maxlength="8"
          placeholder="CODE"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="button" class="shell-cta secondary" id="lobby-join-btn">
          JOIN
        </button>
      </div>
      <div class="shell-actions">
        <button type="button" class="shell-cta" id="lobby-ready-btn" disabled>
          READY
        </button>
        <button
          type="button"
          class="shell-cta secondary"
          id="lobby-leave-btn"
          disabled
        >
          LEAVE
        </button>
      </div>
    </div>

    <div id="rotate-overlay" class="shell-overlay" role="status" aria-live="polite">
      <div class="shell-icon" aria-hidden="true">▭</div>
      <h1>ROTATE</h1>
      <p>Turn your phone sideways for the full pitch.</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
