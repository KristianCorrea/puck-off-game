<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#050b12" />
    <title>Puck Off</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Teko:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: radial-gradient(ellipse at top, #10243a 0%, #050b12 55%);
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        touch-action: none;
      }

      #game canvas {
        image-rendering: auto;
        touch-action: none;
      }

      .shell-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1.5rem;
        padding-top: max(1.5rem, env(safe-area-inset-top));
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        text-align: center;
        font-family: "Nunito", system-ui, sans-serif;
        color: #e2e8f0;
        background: rgba(5, 11, 18, 0.92);
        touch-action: none;
        max-height: 100dvh;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .shell-overlay.is-visible {
        display: flex;
      }

      /* Lobby must scroll / pan on short iPhone landscape. */
      #online-lobby.shell-overlay {
        touch-action: pan-y;
        justify-content: safe center;
      }

      .shell-overlay h1 {
        margin: 0;
        font-family: "Teko", "Arial Narrow", Impact, sans-serif;
        font-size: clamp(2.5rem, 12vw, 4rem);
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #f8fafc;
      }

      .shell-overlay p {
        margin: 0;
        max-width: 18rem;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.4;
        color: #94a3b8;
      }

      .shell-overlay .shell-cta {
        margin-top: 0.5rem;
        border: 0;
        border-radius: 0.35rem;
        padding: 0.85rem 1.6rem;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: #0f172a;
        background: #fbbf24;
        cursor: pointer;
      }

      .shell-overlay .shell-cta:active {
        background: #fde68a;
      }

      @media (orientation: landscape) and (max-height: 500px) {
        .shell-overlay {
          gap: 0.35rem;
          padding: 0.65rem 1rem;
          padding-top: max(0.65rem, env(safe-area-inset-top));
          padding-bottom: max(0.65rem, env(safe-area-inset-bottom));
          justify-content: flex-start;
        }

        .shell-overlay h1 {
          font-size: clamp(1.6rem, 8vh, 2.4rem);
        }

        .shell-overlay p {
          font-size: 0.85rem;
        }

        .shell-overlay .shell-cta {
          margin-top: 0.2rem;
          padding: 0.55rem 1.1rem;
          font-size: 0.95rem;
        }

        .lobby-code {
          font-size: clamp(1.4rem, 7vh, 2rem) !important;
          margin: 0 !important;
        }

        #lobby-countdown {
          font-size: clamp(2rem, 12vh, 3.5rem) !important;
        }

        .shell-actions {
          margin-top: 0.2rem;
        }
      }

      #rotate-overlay .shell-icon {
        font-size: 3rem;
        line-height: 1;
        transform: rotate(90deg);
      }

      .shell-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        justify-content: center;
        margin-top: 0.5rem;
      }

      .shell-cta.secondary {
        background: #334155;
        color: #e2e8f0;
      }

      .shell-cta.secondary:active {
        background: #475569;
      }

      .shell-cta:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .lobby-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
        align-items: center;
        width: min(100%, 22rem);
      }

      .lobby-row input {
        flex: 1 1 8rem;
        min-width: 0;
        border: 1px solid #334155;
        border-radius: 0.35rem;
        padding: 0.7rem 0.85rem;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #f8fafc;
        background: #0f172a;
      }

      .lobby-gate,
      .lobby-room {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 0.65rem;
        width: min(100%, 26rem);
      }

      #online-lobby.is-gate .lobby-gate,
      #online-lobby.is-room .lobby-room,
      #online-lobby.is-countdown .lobby-room {
        display: flex;
      }

      #online-lobby.is-countdown .lobby-room-actions {
        opacity: 0.45;
        pointer-events: none;
      }

      .lobby-code-block {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
      }

      .lobby-code {
        margin: 0;
        font-family: "Teko", "Arial Narrow", Impact, sans-serif;
        font-size: clamp(2rem, 10vw, 3rem);
        letter-spacing: 0.14em;
        color: #fbbf24;
      }

      .lobby-copy-btn {
        margin-top: 0 !important;
        padding: 0.45rem 0.75rem !important;
        font-size: 0.8rem !important;
      }

      .lobby-seats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.55rem;
        width: 100%;
      }

      .lobby-seat {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.35rem;
        padding: 0.75rem 0.85rem;
        border-radius: 0.45rem;
        border: 2px solid #334155;
        background: rgba(15, 23, 42, 0.85);
        text-align: left;
        min-height: 5.25rem;
        transition:
          border-color 0.15s ease,
          background 0.15s ease,
          opacity 0.15s ease;
      }

      .lobby-seat[data-side="player1"] {
        border-color: rgba(45, 212, 191, 0.35);
      }

      .lobby-seat[data-side="player2"] {
        border-color: rgba(251, 113, 133, 0.35);
      }

      .lobby-seat.is-you {
        background: rgba(30, 41, 59, 0.95);
      }

      .lobby-seat.is-you[data-side="player1"] {
        border-color: #2dd4bf;
        box-shadow: 0 0 0 1px rgba(45, 212, 191, 0.25);
      }

      .lobby-seat.is-you[data-side="player2"] {
        border-color: #fb7185;
        box-shadow: 0 0 0 1px rgba(251, 113, 133, 0.25);
      }

      .lobby-seat.is-empty {
        opacity: 0.55;
      }

      .lobby-seat.is-ready {
        background: rgba(15, 23, 42, 0.95);
      }

      .lobby-seat.is-ready[data-side="player1"] {
        border-color: #2dd4bf;
      }

      .lobby-seat.is-ready[data-side="player2"] {
        border-color: #fb7185;
      }

      .lobby-seat-top {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        width: 100%;
      }

      .lobby-seat-dot {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 50%;
        flex-shrink: 0;
        background: #64748b;
      }

      .lobby-seat[data-side="player1"] .lobby-seat-dot {
        background: #2dd4bf;
      }

      .lobby-seat[data-side="player2"] .lobby-seat-dot {
        background: #fb7185;
      }

      .lobby-seat.is-empty .lobby-seat-dot {
        background: #475569;
      }

      .lobby-seat-label {
        font-family: "Teko", "Arial Narrow", Impact, sans-serif;
        font-size: 1.35rem;
        letter-spacing: 0.06em;
        color: #f8fafc;
        line-height: 1;
      }

      .lobby-seat-you {
        margin-left: auto;
        font-size: 0.65rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #fbbf24;
        text-transform: uppercase;
      }

      .lobby-seat-status {
        font-size: 0.85rem;
        font-weight: 800;
        color: #94a3b8;
      }

      .lobby-seat.is-ready .lobby-seat-status {
        color: #4ade80;
      }

      .lobby-seat.is-empty .lobby-seat-status {
        color: #64748b;
      }

      .lobby-hint {
        max-width: none !important;
        font-size: 0.9rem !important;
        color: #cbd5e1 !important;
      }

      .shell-cta.is-ready-on {
        background: #14b8a6;
        color: #042f2e;
      }

      .shell-cta.is-ready-on:active {
        background: #2dd4bf;
      }

      #lobby-countdown {
        display: none;
        margin: 0.25rem 0 0;
        font-family: "Teko", "Arial Narrow", Impact, sans-serif;
        font-size: clamp(3.5rem, 18vw, 6rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1;
        color: #fbbf24;
      }

      #lobby-countdown.is-visible {
        display: block;
      }

      @media (orientation: landscape) and (max-height: 500px) {
        .lobby-seats {
          gap: 0.35rem;
        }

        .lobby-seat {
          min-height: 0;
          padding: 0.45rem 0.6rem;
          gap: 0.15rem;
        }

        .lobby-seat-label {
          font-size: 1.1rem;
        }

        .lobby-seat-status {
          font-size: 0.75rem;
        }

        .lobby-gate,
        .lobby-room {
          gap: 0.35rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <div id="tap-to-play" class="shell-overlay" role="dialog" aria-modal="true">
      <h1>PUCK OFF</h1>
      <p>Landscape play · flick pucks · first to 3</p>
      <div class="shell-actions">
        <button type="button" class="shell-cta" id="play-local-btn" data-mode="local">
          LOCAL
        </button>
        <button
          type="button"
          class="shell-cta secondary"
          id="play-online-btn"
          data-mode="online"
          disabled
        >
          ONLINE · CHECKING…
        </button>
      </div>
    </div>

    <div
      id="tap-to-resume"
      class="shell-overlay"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
    >
      <h1>RESUME</h1>
      <p>Tap to fix the layout after leaving the app.</p>
      <div class="shell-actions">
        <button type="button" class="shell-cta" id="resume-play-btn">
          TAP TO RESUME
        </button>
      </div>
    </div>

    <div
      id="online-lobby"
      class="shell-overlay is-gate"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
    >
      <h1>ONLINE</h1>
      <p id="lobby-status">Connecting…</p>

      <div class="lobby-gate">
        <div class="shell-actions">
          <button type="button" class="shell-cta" id="lobby-create-btn">
            CREATE ROOM
          </button>
        </div>
        <div class="lobby-row">
          <input
            id="lobby-join-input"
            type="text"
            maxlength="8"
            placeholder="CODE"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" class="shell-cta secondary" id="lobby-join-btn">
            JOIN
          </button>
        </div>
      </div>

      <div class="lobby-room">
        <div class="lobby-code-block">
          <p class="lobby-code" id="lobby-code">————</p>
          <button
            type="button"
            class="shell-cta secondary lobby-copy-btn"
            id="lobby-copy-btn"
            title="Copy room code"
          >
            COPY
          </button>
        </div>
        <p id="lobby-countdown" aria-live="polite"></p>
        <div class="lobby-seats" aria-live="polite">
          <div
            class="lobby-seat is-empty"
            data-side="player1"
            id="lobby-seat-p1"
          >
            <div class="lobby-seat-top">
              <span class="lobby-seat-dot" aria-hidden="true"></span>
              <span class="lobby-seat-label">P1</span>
              <span class="lobby-seat-you" hidden>YOU</span>
            </div>
            <span class="lobby-seat-status">Waiting…</span>
          </div>
          <div
            class="lobby-seat is-empty"
            data-side="player2"
            id="lobby-seat-p2"
          >
            <div class="lobby-seat-top">
              <span class="lobby-seat-dot" aria-hidden="true"></span>
              <span class="lobby-seat-label">P2</span>
              <span class="lobby-seat-you" hidden>YOU</span>
            </div>
            <span class="lobby-seat-status">Waiting…</span>
          </div>
        </div>
        <p class="lobby-hint" id="lobby-hint">Share the code, then both Ready.</p>
        <div class="shell-actions lobby-room-actions">
          <button type="button" class="shell-cta" id="lobby-ready-btn" disabled>
            READY
          </button>
          <button
            type="button"
            class="shell-cta secondary"
            id="lobby-leave-btn"
            disabled
          >
            LEAVE
          </button>
        </div>
      </div>
    </div>

    <div id="rotate-overlay" class="shell-overlay" role="status" aria-live="polite">
      <div class="shell-icon" aria-hidden="true">▭</div>
      <h1>ROTATE</h1>
      <p>Turn your phone sideways for the full pitch.</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
