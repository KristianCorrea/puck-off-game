# Thin Phase 10 server deploy (Fly.io).
# 1. fly launch --no-deploy  (or rename `app` below)
# 2. fly secrets set CLIENT_ORIGIN=https://YOUR_CLIENT_ORIGIN
# 3. fly deploy
#
# Keep at least one machine running — rooms are in-memory.

app = "puck-off-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
